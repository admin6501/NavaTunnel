name: Shell checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          for script in *.sh; do bash -n "$script"; done
      - name: Check shell errors
        run: shellcheck --severity=error *.sh
      - name: Test peers, CLI regressions and traffic quotas
        run: python3 -m unittest discover -s tests -v

  network-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install namespace and SSH lab tools
        run: sudo apt-get update -qq && sudo apt-get install -y iproute2 iptables nftables openssh-server openssh-client
      - name: Verify retired-feature cleanup preserves unrelated firewall rules
        run: sudo unshare -n python3 tests/labs/retired_cleanup.py
      - name: Verify official FRP test binaries
        run: python3 tests/labs/fetch_frp.py "$RUNNER_TEMP/nava-frp"
      - name: Test multiple Iran clients on one foreign host over GRE and FOU
        run: |
          sudo modprobe ip_gre
          sudo modprobe fou
          sudo unshare -mn bash -c 'mount --make-rprivate /; mount -t sysfs sysfs /sys; exec python3 tests/labs/multi_foreign.py "$1"' lab "$RUNNER_TEMP/nava-frp"
      - name: Verify owned SSH account retirement and real sshd configuration
        run: sudo python3 tests/labs/ssh_retirement.py

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.12
          cache-dependency-path: core/go.mod
      - name: Test TLS forwarding and race safety
        run: cd core && go test -race ./...
