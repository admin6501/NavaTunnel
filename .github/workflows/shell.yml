name: Shell checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          for script in *.sh; do bash -n "$script"; done
      - name: Check shell errors
        run: shellcheck --severity=error *.sh
      - name: Test peers, CLI regressions and traffic quotas
        run: python3 -m unittest discover -s tests -v

  network-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.12
          cache-dependency-path: core/go.mod
      - name: Build race-instrumented standalone core
        run: cd core && go build -race -o "$RUNNER_TEMP/NavaTunnel-core-lab" .
      - name: Install namespace and SSH lab tools
        run: sudo apt-get update -qq && sudo apt-get install -y iproute2 iptables nftables openssh-server openssh-client
      - name: Test original Cluster forwarding, failover and TLS heartbeat
        run: sudo unshare -n python3 tests/labs/upstream_core.py "$RUNNER_TEMP/NavaTunnel-core-lab"
      - name: Verify pinned official FRP lab binaries
        run: python3 tests/labs/fetch_frp.py "$RUNNER_TEMP/nava-frp"
      - name: Verify retired-feature cleanup preserves unrelated firewall rules
        run: sudo unshare -n python3 tests/labs/retired_cleanup.py
      - name: Test NavaLink TCP, UDP and SSH authorization boundaries
        run: sudo python3 tests/labs/navalink_ssh.py "$RUNNER_TEMP/nava-frp"

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.12
          cache-dependency-path: core/go.mod
      - name: Test Cluster backend and race safety
        run: cd core && go test -race ./...
