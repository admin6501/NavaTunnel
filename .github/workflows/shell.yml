name: Shell checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          for script in *.sh; do bash -n "$script"; done
      - name: Check shell errors
        run: shellcheck --severity=error *.sh
      - name: Test peers, CLI regressions and traffic quotas
        run: python3 -m unittest discover -s tests -v

  network-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install namespace and SSH lab tools
        run: sudo apt-get update -qq && sudo apt-get install -y iproute2 iptables openssh-server openssh-client
      - name: Verify pinned official FRP lab binaries
        run: python3 tests/labs/fetch_frp.py "$RUNNER_TEMP/nava-frp"
      - name: Test owned cluster NAT and rollback in isolated namespaces
        run: sudo unshare -n python3 tests/labs/cluster_netns.py
      - name: Test NavaLink TCP, UDP and SSH authorization boundaries
        run: sudo python3 tests/labs/navalink_ssh.py "$RUNNER_TEMP/nava-frp"
